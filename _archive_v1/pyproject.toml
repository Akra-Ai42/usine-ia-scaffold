[project]
name = "vigie"
version = "0.1.0"
description = "Agent SOC LangGraph pour AtlasMétaux - support pédagogique MSc2"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "langgraph==0.2.28",
    "langchain-openai==0.2.3",
    "langchain-community==0.3.3",
    "qdrant-client==1.11.3",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.1.1",
    "psycopg[binary]>=3.2.10",
    "redis==5.1.1",
    "langfuse==2.53.3",
    "streamlit>=1.39.0",
    "httpx==0.27.2",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "ruff==0.7.1",
    "mypy==1.13.0",
    "httpx==0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
