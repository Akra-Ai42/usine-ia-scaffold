services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vigie
      POSTGRES_PASSWORD: vigie
      POSTGRES_DB: vigie
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigie"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # curl absent de l'image — TCP check via bash /dev/tcp (bash présent sur debian:bookworm-slim)
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Langfuse self-hosted ────────────────────────────────────────────────────

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 3s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      # Générer avec : openssl rand -base64 32
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-in-prod}
      SALT: ${LANGFUSE_SALT:-change-me-in-prod}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: vigie-org
      LANGFUSE_INIT_ORG_NAME: "Vigie SOC"
      LANGFUSE_INIT_PROJECT_ID: vigie-project
      LANGFUSE_INIT_PROJECT_NAME: "Vigie Agent"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-vigie-public-key}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-vigie-secret-key}

  # ── Application Vigie ───────────────────────────────────────────────────────

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DSN: postgresql://vigie:vigie@db:5432/vigie
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LANGFUSE_HOST: http://langfuse:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-vigie-public-key}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-vigie-secret-key}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-anthropic/claude-3.5-sonnet}
      APP_ENV: production
      LOG_LEVEL: INFO
    volumes:
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  ui:
    build: .
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      VIGIE_API_URL: http://api:8000
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true

  # ── Init one-shot ───────────────────────────────────────────────────────────

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DSN: postgresql://vigie:vigie@db:5432/vigie
    command: python -m app.adapters.db.migrate
    profiles:
      - init

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  langfuse_db_data:
